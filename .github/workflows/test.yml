name: Run tests

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x, latest]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
              if: matrix.node != '24.x'
            # One matrix entry runs the suite under c8, which enforces the thresholds in .c8rc.json
            - run: npm run test:coverage
              if: matrix.node == '24.x'
            # Node 22+ loads ES modules through require() by default, which would hide an ESM-only
            # dependency. Load the built CommonJS entry with that turned off, as the pkg binary
            # EmailEngine ships would load it.
            - name: Run the CommonJS smoke test with require(esm) disabled
              if: matrix.node != '20.x'
              run: npm run test:cjs
